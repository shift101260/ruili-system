<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睿立業務系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cosmic: {
                            950: '#060b19', 900: '#0a142c', 800: '#112246', 700: '#1a3160', 600: '#234280', 500: '#315cb5', 400: '#4c7cd4'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #060b19; color: #e2e8f0; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* 自訂滾動條 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #060b19; }
        ::-webkit-scrollbar-thumb { background: #1a3160; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #315cb5; }

        /* 📜 N版極致：專屬直式 A4 滿頁匯出與物理屏蔽排版優化 */
        @media print {
            @page {
                size: portrait A4;
                margin: 10mm !important;
            }
            html, body {
                background: #ffffff !important;
                color: #000000 !important;
                overflow: visible !important;
                height: auto !important;
                width: 100% !important;
                font-size: 12pt !important;
            }
            aside, header, .no-print, input[type="file"], button, #login-overlay, #trash-modal, #delete-modal {
                display: none !important;
            }
            main {
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
                display: block !important;
                background: transparent !important;
            }
            .print-container { 
                width: 100% !important; 
                max-width: 100% !important;
                background: #ffffff !important; 
                color: #000000 !important; 
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                display: block !important;
            }
            .card-box {
                background: #ffffff !important;
                border: 1px solid #000000 !important;
                color: #000000 !important;
                padding: 12px !important;
                border-radius: 6px !important;
                box-shadow: none !important;
                page-break-inside: avoid !important;
                margin-bottom: 12px !important;
            }
            input, select, textarea { 
                background: transparent !important; 
                color: #000000 !important; 
                border: none !important; 
                border-bottom: 1px solid #444444 !important;
                border-radius: 0 !important;
                padding: 2px 4px !important;
                font-weight: bold !important;
                box-shadow: none !important;
                outline: none !important;
            }
            textarea {
                height: auto !important;
                overflow: visible !important;
                resize: none !important;
            }
            .text-white, .text-slate-300, .text-slate-400, .text-amber-300, .text-amber-400, .text-cyan-400, .text-emerald-400, .text-purple-300, .text-purple-400, .text-indigo-300, .text-indigo-400, .text-teal-400, .text-sky-400, .text-violet-400, label { 
                color: #000000 !important; 
                -webkit-text-fill-color: #000000 !important;
                opacity: 1 !important;
                display: inline-block !important;
                font-weight: bold !important;
            }
            .bg-cosmic-950, .bg-cosmic-900, .bg-cosmic-800, .bg-cosmic-950\/40, .bg-cosmic-900\/60, .bg-cosmic-950\/60, .bg-cosmic-900\/30, .bg-cosmic-950\/80, .bg-cosmic-950\/50, .bg-cosmic-900\/80, .bg-cosmic-900\/30 {
                background: transparent !important;
            }
            footer {
                border-top: 1px solid #000000 !important;
                color: #000000 !important;
                margin-top: 20px !important;
                padding-top: 10px !important;
            }
            h3, h4 {
                color: #000000 !important;
                border-bottom: 1px solid #000000 !important;
                padding-bottom: 4px !important;
            }
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- LEFT SIDEBAR -->
    <aside class="w-64 lg:w-72 bg-cosmic-900 border-r border-cosmic-700/50 flex flex-col justify-between shrink-0 select-none">
        <div>
            <div class="p-4 lg:p-6 border-b border-cosmic-700/30 flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-cosmic-500 to-cyan-400 rounded-xl flex items-center justify-center shadow-lg shrink-0">
                    <i class="fa-solid fa-folder-tree text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg lg:text-xl font-bold tracking-wider text-white">睿立集團</h1>
                    <p class="text-xs text-slate-400">RUILI SYSTEM N</p>
                </div>
            </div>

            <!-- 五大軌道 -->
            <nav class="p-3 lg:p-4 space-y-1.5 overflow-y-auto max-h-[calc(100vh-240px)]">
                <div>
                    <button onclick="toggleCategory('case-eval')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition text-slate-300 hover:bg-cosmic-800/60">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-folder-open w-5 text-center text-cyan-400"></i>
                            <span class="font-medium text-sm tracking-wide">專案管理</span>
                        </div>
                        <i id="arrow-case-eval" class="fa-solid fa-chevron-down text-xs text-slate-500"></i>
                    </button>
                    <div id="sub-list-case-eval" class="hidden pl-7 pr-2 mt-1 space-y-1 border-l border-cosmic-700/40 ml-5"></div>
                </div>

                <div>
                    <button onclick="toggleCategory('solar')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition text-slate-300 hover:bg-cosmic-800/60">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-solar-panel w-5 text-center text-amber-400"></i>
                            <span class="font-medium text-sm tracking-wide">太陽能自建</span>
                        </div>
                        <i id="arrow-solar" class="fa-solid fa-chevron-down text-xs text-slate-500"></i>
                    </button>
                    <div id="sub-list-solar" class="hidden pl-7 pr-2 mt-1 space-y-1 border-l border-cosmic-700/40 ml-5"></div>
                </div>

                <div>
                    <button onclick="toggleCategory('trading')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition text-slate-300 hover:bg-cosmic-800/60">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-building-circle-arrow-right w-5 text-center text-emerald-400"></i>
                            <span class="font-medium text-sm tracking-wide">工廠買賣案件資料表</span>
                        </div>
                        <i id="arrow-trading" class="fa-solid fa-chevron-down text-xs text-slate-500"></i>
                    </button>
                    <div id="sub-list-trading" class="hidden pl-7 pr-2 mt-1 space-y-1 border-l border-cosmic-700/40 ml-5"></div>
                </div>

                <div>
                    <button onclick="toggleCategory('meeting')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition text-slate-300 hover:bg-cosmic-800/60">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-handshake w-5 text-center text-purple-400"></i>
                            <span class="font-medium text-sm tracking-wide">會議記錄</span>
                        </div>
                        <i id="arrow-meeting" class="fa-solid fa-chevron-down text-xs text-slate-500"></i>
                    </button>
                    <div id="sub-list-meeting" class="hidden pl-7 pr-2 mt-1 space-y-1 border-l border-cosmic-700/40 ml-5"></div>
                </div>

                <div>
                    <button onclick="toggleCategory('internal-meet')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition text-slate-300 hover:bg-cosmic-800/60">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-comments w-5 text-center text-indigo-400"></i>
                            <span class="font-medium text-sm tracking-wide">睿立會議紀錄</span>
                        </div>
                        <i id="arrow-internal-meet" class="fa-solid fa-chevron-down text-xs text-slate-500"></i>
                    </button>
                    <div id="sub-list-internal-meet" class="hidden pl-7 pr-2 mt-1 space-y-1 border-l border-cosmic-700/40 ml-5"></div>
                </div>
            </nav>
        </div>

        <!-- 資源回收桶按鈕 -->
        <div id="trash-bin-button-container" class="p-4 border-t border-cosmic-700/30">
            <button onclick="openTrashModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold py-2.5 px-4 rounded-xl flex items-center justify-center space-x-2 border border-slate-600 transition">
                <i class="fa-solid fa-trash-arrow-up text-amber-400"></i>
                <span>資源回收桶 (一鍵復原)</span>
            </button>
        </div>
    </aside>

    <!-- MAIN VIEWPORT -->
    <main class="flex-1 flex flex-col overflow-hidden bg-cosmic-950">
        <!-- TOP BAR -->
        <header class="h-16 border-b border-cosmic-700/40 px-3 lg:px-6 flex items-center justify-between shrink-0 bg-cosmic-900/40 backdrop-blur-md z-10 no-print overflow-x-auto gap-2">
            <div class="flex items-center space-x-2 lg:space-x-3 shrink-0">
                <input type="text" id="global-search" oninput="filterCases()" placeholder="按公司或會議主題關鍵字篩選..." class="w-40 lg:w-60 bg-cosmic-950 border border-cosmic-700 rounded-xl px-3 py-1.5 text-xs lg:text-sm text-white focus:outline-none">
                
                <!-- 已登入使用者提示資訊 -->
                <div id="current-user-badge" class="flex items-center space-x-1.5 bg-cosmic-950/80 border border-cyan-500/50 px-2.5 py-1 rounded-xl text-xs text-cyan-400 shrink-0">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>使用者：<strong id="user-display-name" class="text-white">中央控台</strong></span>
                </div>

                <!-- 自動同步狀態提示徽章 -->
                <div id="sync-status-badge" class="flex items-center space-x-1.5 text-xs px-2 py-1 rounded-lg bg-cosmic-900 border border-cosmic-700 text-slate-400 shrink-0">
                    <i id="sync-icon" class="fa-solid fa-cloud"></i>
                    <span id="sync-text">已連線</span>
                </div>
            </div>

            <!-- 右側功能按鈕 -->
            <div class="flex items-center space-x-1.5 lg:space-x-2 shrink-0">
                <button onclick="addNewCase()" class="bg-gradient-to-r from-cosmic-500 to-blue-600 text-white text-xs font-semibold px-2.5 lg:px-3 py-2 rounded-xl flex items-center space-x-1 shadow-md hover:opacity-90 transition shrink-0 whitespace-nowrap">
                    <i class="fa-solid fa-plus"></i><span>新增案件</span>
                </button>
                <button onclick="deleteCurrentCase()" class="bg-red-600 hover:bg-red-500 text-white text-xs font-semibold px-2.5 lg:px-3 py-2 rounded-xl flex items-center space-x-1 shadow-md transition shrink-0 whitespace-nowrap">
                    <i class="fa-solid fa-trash-can"></i><span>刪除案件</span>
                </button>
                <button onclick="window.print()" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-semibold px-2.5 lg:px-3 py-2 rounded-xl flex items-center shadow-lg transition shrink-0 whitespace-nowrap">
                    <i class="fa-solid fa-print mr-1"></i> 一鍵匯出
                </button>
                <button onclick="saveToCloud()" class="bg-emerald-600 text-white text-xs font-semibold px-3 lg:px-4 py-2 rounded-xl hover:bg-emerald-500 transition shrink-0 whitespace-nowrap">
                    儲存
                </button>
            </div>
        </header>

        <!-- ROUTING CONTENT -->
        <div class="flex-1 overflow-y-auto p-4 lg:p-8 flex justify-center">
            <div class="w-full max-w-5xl print-container">
                <section id="tab-case-eval" class="tab-content active"><div id="case-eval-container" class="space-y-6"></div></section>
                <section id="tab-solar" class="tab-content"><div id="solar-container" class="space-y-6"></div></section>
                <section id="tab-trading" class="tab-content"><div id="trading-container" class="space-y-6"></div></section>
                <section id="tab-meeting" class="tab-content"><div id="meeting-container" class="space-y-6"></div></section>
                <section id="tab-internal-meet" class="tab-content"><div id="internal-meet-container" class="space-y-6"></div></section>
            </div>
        </div>
    </main>

    <!-- 自訂刪除案件確認彈窗 -->
    <div id="delete-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center no-print">
        <div class="bg-cosmic-900 border border-cosmic-700 rounded-2xl p-6 w-96 shadow-2xl space-y-5 text-center">
            <div class="w-12 h-12 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-base font-bold text-white">確定要刪除嗎？</h3>
            <p class="text-xs text-slate-400" id="delete-target-text">刪除後資料將移至資源回收桶。</p>
            <div class="flex justify-center space-x-3 pt-2">
                <button onclick="confirmDeleteCase()" class="bg-red-600 hover:bg-red-500 text-white text-xs font-bold px-5 py-2 rounded-xl transition">確認</button>
                <button onclick="closeDeleteModal()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-5 py-2 rounded-xl transition">取消</button>
            </div>
        </div>
    </div>

    <!-- 資源回收桶 Modal -->
    <div id="trash-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print">
        <div class="bg-cosmic-900 border border-cosmic-700 rounded-2xl p-6 w-full max-w-2xl shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-cosmic-700/50 pb-3">
                <h3 class="text-base font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-trash-arrow-up text-amber-400"></i>
                    <span>資源回收桶 (已刪除案件列表)</span>
                </h3>
                <button onclick="closeTrashModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="trash-items-list" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
            <div class="text-right pt-2 border-t border-cosmic-700/30">
                <button onclick="closeTrashModal()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-4 py-2 rounded-xl transition">關閉</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== Supabase 設定與初始化 ====================
        const SUPABASE_URL = "https://mfgfifcyhxeqjyeaokub.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_b712iObCqLZeepWP9SVQaA__Rg2_PTj";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUserRole = "中央控台";

        let caseEvalData = [];
        let solarData = [];
        let tradingData = [];
        let meetingData = [];
        let internalMeetData = [];

        let selectedIds = { "case-eval": null, "solar": null, "trading": null, "meeting": null, "internal-meet": null };
        let currentActiveTab = "case-eval";

        const managersList = ["樊靖畇", "鄭家承", "陳宥騰", "楊裕憲", "楊淯淳", "黃逸豪"];
        const statusConfig = { "初期評估": "bg-emerald-500", "已報價": "bg-blue-500", "準備簽約": "bg-amber-500", "已簽約": "bg-red-500", "結案": "bg-purple-500", "沒下文": "bg-slate-600" };

        let autoSaveTimer = null;
        let isUserTyping = false;

        function autoResizeTextarea(el) {
            if (!el) return;
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function setSyncBadgeStatus(state, text) {
            const badge = document.getElementById('sync-status-badge');
            const icon = document.getElementById('sync-icon');
            const label = document.getElementById('sync-text');
            if(!badge) return;
            badge.classList.remove('hidden');
            
            if (state === 'saving') {
                icon.className = 'fa-solid fa-spinner animate-spin text-amber-400';
                label.innerText = text || '雲端同步中...';
                label.className = 'text-amber-400 font-medium';
            } else if (state === 'saved') {
                icon.className = 'fa-solid fa-cloud-check text-emerald-400';
                label.innerText = text || '資料已同步';
                label.className = 'text-emerald-400 font-medium';
            } else if (state === 'error') {
                icon.className = 'fa-solid fa-triangle-exclamation text-red-400';
                label.innerText = text || '同步失敗';
                label.className = 'text-red-400 font-medium';
            } else {
                icon.className = 'fa-solid fa-cloud text-slate-400';
                label.innerText = text || '已連線';
                label.className = 'text-slate-400';
            }
        }

        function triggerAutoSave() {
            isUserTyping = true;
            setSyncBadgeStatus('saving', '編輯中...');
            
            if (autoSaveTimer) clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(async () => {
                await saveToCloudSilent();
                isUserTyping = false;
                setSyncBadgeStatus('saved', '雲端已同步');
            }, 800);
        }

        function toggleCategory(catId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            ["case-eval", "solar", "trading", "meeting", "internal-meet"].forEach(id => {
                document.getElementById(`sub-list-${id}`)?.classList.add('hidden');
            });
            document.getElementById(`sub-list-${catId}`)?.classList.remove('hidden');
            currentActiveTab = catId;
            document.getElementById(`tab-${catId}`)?.classList.add('active');
            renderSidebarSubLists(); renderMainForms();
        }

        function getTargetDataArray(tabId) {
            if (tabId === 'case-eval') return caseEvalData;
            if (tabId === 'solar') return solarData;
            if (tabId === 'trading') return tradingData;
            if (tabId === 'meeting') return meetingData;
            if (tabId === 'internal-meet') return internalMeetData;
            return [];
        }

        function isCaseBelongsToUser(caseObj, userName) {
            if (currentUserRole === '中央控台') return true;
            if (caseObj.evalManager === userName || caseObj.solarManager === userName || caseObj.manager === userName) return true;
            if (caseObj.ruiliAttendees && caseObj.ruiliAttendees.includes(userName)) return true;
            if (caseObj.attendees && caseObj.attendees.includes(userName)) return true;
            return false;
        }

        function renderSidebarSubLists() {
            ["case-eval", "solar", "trading", "meeting", "internal-meet"].forEach(tabId => {
                const container = document.getElementById(`sub-list-${tabId}`);
                if (!container) return;
                let dataArr = getTargetDataArray(tabId);

                if (currentUserRole !== '中央控台') {
                    dataArr = dataArr.filter(c => !c.is_deleted && isCaseBelongsToUser(c, currentUserRole));
                }

                container.innerHTML = dataArr.map(c => {
                    let deletedBadge = '';
                    if (c.is_deleted) {
                        const delTime = c.deleted_at ? new Date(c.deleted_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                        deletedBadge = `<span class="ml-1 text-[10px] bg-slate-700 text-slate-300 px-1 py-0.5 rounded border border-slate-600">[已刪除 ${delTime}]</span>`;
                    }
                    return `
                        <button onclick="selectSpecificCase('${c.id}', '${tabId}')" class="w-full text-left py-1.5 px-3 rounded-lg text-xs truncate transition ${selectedIds[tabId] === c.id && currentActiveTab === tabId ? 'bg-cosmic-500 text-white font-semibold' : 'text-slate-400 hover:text-slate-200'} ${c.is_deleted ? 'opacity-70' : ''}">
                            <i class="fa-solid fa-folder mr-2"></i>${c.companyName || c.meetSubject || '未命名項目'} ${deletedBadge}
                        </button>
                    `;
                }).join('');
            });
        }

        function selectSpecificCase(id, tabId) { selectedIds[tabId] = id; renderMainForms(); renderSidebarSubLists(); }

        function filterCases() {
            const query = document.getElementById('global-search').value.toLowerCase();
            const container = document.getElementById(`sub-list-${currentActiveTab}`);
            if (!container) return;
            let dataArr = getTargetDataArray(currentActiveTab);
            if (currentUserRole !== '中央控台') {
                dataArr = dataArr.filter(c => !c.is_deleted && isCaseBelongsToUser(c, currentUserRole));
            }
            container.innerHTML = dataArr.filter(c => {
                const name = c.companyName || c.meetSubject || '';
                return name.toLowerCase().includes(query);
            }).map(c => {
                let deletedBadge = '';
                if (c.is_deleted) {
                    const delTime = c.deleted_at ? new Date(c.deleted_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                    deletedBadge = `<span class="ml-1 text-[10px] bg-slate-700 text-slate-300 px-1 py-0.5 rounded border border-slate-600">[已刪除 ${delTime}]</span>`;
                }
                return `
                    <button onclick="selectSpecificCase('${c.id}', '${currentActiveTab}')" class="w-full text-left py-1.5 px-3 rounded-lg text-xs truncate transition ${selectedIds[currentActiveTab] === c.id ? 'bg-cosmic-500 text-white font-semibold' : 'text-slate-400 hover:text-slate-200'}">
                        <i class="fa-solid fa-folder mr-2"></i>${c.companyName || c.meetSubject || '未命名項目'} ${deletedBadge}
                    </button>
                `;
            }).join('');
        }

        function ensureLandOwnerGroups(c) {
            if (!c.landOwnerGroups || !Array.isArray(c.landOwnerGroups) || c.landOwnerGroups.length === 0) {
                c.landOwnerGroups = [{
                    ownerName: c.landOwner || "",
                    city: c.city || "高雄市",
                    region: c.region || "岡山區",
                    landSection: c.landSection || "",
                    lands: Array.isArray(c.lands) ? c.lands : []
                }];
            }
        }

        function renderMainForms() {
            let dataArr = getTargetDataArray(currentActiveTab);
            if (currentUserRole !== '中央控台') {
                dataArr = dataArr.filter(c => !c.is_deleted && isCaseBelongsToUser(c, currentUserRole));
            }

            if (!selectedIds[currentActiveTab] && dataArr.length > 0) {
                selectedIds[currentActiveTab] = dataArr[0].id;
            }

            const activeCase = dataArr.find(c => c.id === selectedIds[currentActiveTab]) || dataArr[0];
            const container = document.getElementById(currentActiveTab + "-container");
            if (!container) return;

            if (!activeCase) { container.innerHTML = "<p class='text-xs text-slate-500 p-4'>暫無項目。</p>"; return; }

            if (currentActiveTab === 'case-eval') {
                if (activeCase.city === undefined) activeCase.city = "高雄市";
                if (activeCase.region === undefined) activeCase.region = "岡山區";
                if (!activeCase.clientFilesObj) activeCase.clientFilesObj = [];
                if (!activeCase.ruiliFilesObj) activeCase.ruiliFilesObj = [];
                if (!activeCase.services) activeCase.services = [];
                ensureLandOwnerGroups(activeCase);
                container.innerHTML = generateCaseEvalHTML(activeCase);
            } else if (currentActiveTab === 'solar') {
                if (!activeCase.lands) activeCase.lands = [];
                if (!activeCase.buildingsLegal) activeCase.buildingsLegal = [];
                if (!activeCase.buildingsIllegal) activeCase.buildingsIllegal = [];
                if (!activeCase.solarServices) activeCase.solarServices = [];
                if (!activeCase.customDocsClient) activeCase.customDocsClient = [];
                if (!activeCase.customDocsRuili) activeCase.customDocsRuili = [];
                if (!activeCase.clientFilesObj) activeCase.clientFilesObj = [];
                if (!activeCase.ruiliFilesObj) activeCase.ruiliFilesObj = [];
                container.innerHTML = generateSolarHTML(activeCase);
                calculateSolarLive(activeCase.id);
            } else if (currentActiveTab === 'trading') {
                container.innerHTML = generateTradingHTML(activeCase);
            } else if (currentActiveTab === 'meeting') {
                if (!activeCase.ruiliAttendees) activeCase.ruiliAttendees = [];
                if (!activeCase.externalRepresentatives) activeCase.externalRepresentatives = [];
                if (!activeCase.contents) activeCase.contents = [];
                if (!activeCase.uploadedFiles) activeCase.uploadedFiles = [];
                container.innerHTML = generateMeetingHTML(activeCase);
            } else if (currentActiveTab === 'internal-meet') {
                if (!activeCase.attendees) activeCase.attendees = [];
                if (!activeCase.caseReports) activeCase.caseReports = [];
                if (!activeCase.proposalReports) activeCase.proposalReports = [];
                if (!activeCase.uploadedFiles) activeCase.uploadedFiles = [];
                container.innerHTML = generateInternalMeetHTML(activeCase);
            }

            setTimeout(() => {
                container.querySelectorAll('textarea').forEach(el => autoResizeTextarea(el));
            }, 0);
        }

        function previewFileUrl(url, fileName) {
            if (!url) {
                alert("目前檔案尚未有雲端完整 URL，無法開啟。");
                return;
            }
            const ext = (fileName || '').split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'pdf'].includes(ext)) {
                window.open(url, '_blank');
            } else {
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName || 'download';
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }

        function renderDownloadBtnHTML(fileUrl, fileName) {
            return `<button onclick="previewFileUrl('${fileUrl||''}', '${fileName||''}')" class="text-cyan-400 hover:text-cyan-300 text-xs mr-2 border border-cyan-500/40 px-2 py-0.5 rounded bg-cosmic-950 no-print" title="點擊下載/開啟檔案"><i class="fa-solid fa-download mr-1"></i>下載</button>`;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            e.currentTarget.classList.add('border-cyan-400', 'bg-cosmic-900/90');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            e.stopPropagation();
            e.currentTarget.classList.remove('border-cyan-400', 'bg-cosmic-900/90');
        }

        async function handleDropFile(e, id, type, side) {
            e.preventDefault();
            e.stopPropagation();
            e.currentTarget.classList.remove('border-cyan-400', 'bg-cosmic-900/90');

            const files = e.dataTransfer.files;
            if (!files || files.length === 0) return;

            const dummyInput = { files: files };
            if (type === 'project') {
                await handleProjectFileUpload(dummyInput, id, side);
            } else if (type === 'solar') {
                await handleSolarFileUpload(dummyInput, id, side);
            } else if (type === 'meeting') {
                await handleExternalMeetingUpload(dummyInput, id);
            } else if (type === 'internal-meet') {
                await handleRuiliMeetUpload(dummyInput, id);
            }
        }

        /* 介面 HTML 生成與輔助函式維持原邏輯 */

            let rawLegalPing = c.buildingsLegal ? c.buildingsLegal.reduce((sum, b) => sum + parseFloat(b.ping || 0), 0) : 0;

            let rawIllegalPing = c.buildingsIllegal ? c.buildingsIllegal.reduce((sum, b) => sum + parseFloat(b.ping || 0), 0) : 0;
            let totalIllegalPing = Math.round(rawIllegalPing * 100) / 100;

            return `

                    <!-- 一、專案人員 -->
                    <div class="bg-cosmic-950/40 border border-cosmic-700/30 p-4 rounded-xl space-y-3 card-box">
                        <h4 class="text-xs font-bold text-cyan-400 border-b border-cosmic-700/30 pb-1.5">一、專案人員</h4>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
                            <div><label class="text-slate-400 block mb-0.5">日期 / 時間：</label><input type="datetime-local" value="${c.evalDate||''}" onchange="updateField('${c.id}', 'evalDate', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1 text-white"></div>
                            <div><label class="text-slate-400 block mb-0.5">專案經理：</label>
                                <select onchange="updateField('${c.id}', 'evalManager', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1 text-white">
                                    ${managersList.map(m => `<option value="${m}" ${c.evalManager === m ? 'selected':''}>${m}</option>`).join('')}
                                </select>
                            </div>
                            <div><label class="text-slate-400 block mb-0.5">案件狀態：</label>
                                <select onchange="updateField('${c.id}', 'evalStatus', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1 text-white">
                                    ${Object.keys(statusConfig).map(st => `<option value="${st}" ${c.evalStatus === st ? 'selected':''}>${st}</option>`).join('')}

                    <!-- 二、公司基本資料 -->
                    <div class="bg-cosmic-950/40 border border-cosmic-700/30 p-4 rounded-xl space-y-3 card-box">
                        <h4 class="text-xs font-bold text-cyan-400 border-b border-cosmic-700/30 pb-1.5">二、公司基本資料</h4>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
                            <div class="md:col-span-2"><label class="text-slate-400">公司名稱：</label><input type="text" value="${c.companyName}" oninput="updateCompanyName('${c.id}', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1.5 text-white font-medium"></div>
                            <div><label class="text-slate-400">統編：</label><input type="text" value="${c.taxId||''}" oninput="updateField('${c.id}', 'taxId', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1.5 text-white"></div>
                            <div><label class="text-slate-400">工廠登記證字號：</label><input type="text" value="${c.factoryLicense||''}" oninput="updateField('${c.id}', 'factoryLicense', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1.5 text-white"></div>
                            <div><label class="text-slate-400">產業類型：</label><input type="text" value="${c.industryType||''}" oninput="updateField('${c.id}', 'industryType', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1.5 text-white"></div>
                            <div><label class="text-slate-400">聯絡人：</label><input type="text" value="${c.contact||''}" oninput="updateField('${c.id}', 'contact', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1.5 text-white"></div>
                            <div><label class="text-slate-400">聯絡電話：</label><input type="text" value="${c.phone||''}" oninput="updateField('${c.id}', 'phone', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1.5 text-white"></div>
                            <div><label class="text-slate-400">E-mail：</label><input type="text" value="${c.email||''}" oninput="updateField('${c.id}', 'email', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1.5 text-white"></div>
                            <div class="md:col-span-2"><label class="text-slate-400">工廠地址：</label><input type="text" value="${c.address||''}" oninput="updateField('${c.id}', 'address', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1.5 text-white"></div>
                            <div class="md:col-span-2"><label class="text-slate-400">公司地址：</label><input type="text" value="${c.companyAddress||''}" oninput="updateField('${c.id}', 'companyAddress', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1.5 text-white"></div>
                            <div><label class="text-slate-400">公司電話：</label><input type="text" value="${c.companyPhone||''}" oninput="updateField('${c.id}', 'companyPhone', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1.5 text-white"></div>
                            <div><label class="text-slate-400">傳真：</label><input type="text" value="${c.fax||''}" oninput="updateField('${c.id}', 'fax', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1.5 text-white"></div>
                            <div class="md:col-span-2"><label class="text-slate-400">公司匯款帳戶：</label><input type="text" value="${c.bankAccount||''}" oninput="updateField('${c.id}', 'bankAccount', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1.5 text-white"></div>
                            <div class="md:col-span-2"><label class="text-slate-400">公司網站連結：</label><input type="text" value="${c.website||''}" oninput="updateField('${c.id}', 'website', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1.5 text-white"></div>
                            <div class="md:col-span-4"><label class="text-slate-400 block mb-0.5">備註：</label><textarea oninput="updateField('${c.id}', 'companyRemark', this.value); autoResizeTextarea(this);" class="w-full bg-cosmic-950 border border-cosmic-700 rounded p-1.5 text-white overflow-hidden resize-none block whitespace-pre-wrap">${c.companyRemark||''}</textarea></div>
                        </div>
                    </div>

                    ${generateFooterHTML()}
                </div>
            `;
        }

        function generateSolarHTML(c) {
            return `
                <div class="card-box bg-cosmic-800/70 border border-amber-500/40 rounded-2xl p-6 space-y-6 shadow-xl">
                    <div class="border-b border-amber-500/40 pb-2"><h3 class="text-sm font-bold text-amber-400"><i class="fa-solid fa-solar-panel mr-2"></i>太陽能自建</h3></div>
                    <div class="bg-cosmic-950/40 border border-cosmic-700/30 p-4 rounded-xl space-y-3 card-box">
                        <h4 class="text-xs font-bold text-cyan-400 border-b border-cosmic-700/30 pb-1.5">公司名稱：${c.companyName}</h4>
                    </div>
                    ${generateFooterHTML()}
                </div>
            `;
        }

        function generateTradingHTML(c) {
            return `<div class="card-box bg-cosmic-800/70 border border-emerald-500/40 rounded-2xl p-6 space-y-4 shadow-xl"><h3 class="text-sm font-bold text-emerald-400"><i class="fa-solid fa-building-circle-arrow-right mr-2"></i>三、工廠買賣案件資料表</h3><div class="flex items-center space-x-2"><label class="text-slate-400 text-xs font-bold shrink-0">公司名稱：</label><input type="text" value="${c.companyName}" oninput="updateCompanyName('${c.id}', this.value)" class="bg-cosmic-950 border border-cosmic-700 rounded p-1.5 text-white text-xs w-full"></div>${generateFooterHTML()}</div>`;
        }

        function generateMeetingHTML(c) {
            return `
                <div class="card-box bg-cosmic-800/70 border border-purple-500/50 rounded-2xl p-6 space-y-6 shadow-xl">
                    <div class="border-b border-purple-500/40 pb-2"><h3 class="text-sm font-bold text-purple-400"><i class="fa-solid fa-handshake mr-2"></i>會議記錄</h3></div>
                    <div class="bg-cosmic-950/40 border border-cosmic-700/30 p-4 rounded-xl space-y-3 card-box">
                        <label class="text-slate-400 block text-xs">會議主題：</label>
                        <input type="text" value="${c.meetSubject||''}" oninput="updateMeetSubject('${c.id}', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1.5 text-white font-semibold text-xs">
                    </div>
                    ${generateFooterHTML()}
                </div>
            `;
        }

        function generateInternalMeetHTML(c) {
            return `
                <div class="card-box bg-cosmic-800/70 border border-indigo-500/50 rounded-2xl p-6 space-y-6 shadow-xl">
                    <div class="border-b border-indigo-500/40 pb-2 flex justify-between items-center">
                        <h3 class="text-sm font-bold text-indigo-400"><i class="fa-solid fa-comments mr-2"></i>睿立會議紀錄</h3>
                    </div>
                    <div class="bg-cosmic-950/40 border border-cosmic-700/30 p-4 rounded-xl space-y-3 card-box">
                        <label class="text-slate-400 block text-xs">會議主題：</label>
                        <input type="text" value="${c.meetSubject||''}" oninput="updateMeetSubject('${c.id}', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1.5 text-white font-medium text-xs">
                    </div>
                    ${generateFooterHTML()}
                </div>
            `;
        }

        function generateFooterHTML() {
            return `
                <footer class="bg-cosmic-950 px-6 py-4 border-t border-cosmic-700/40 text-[11px] text-slate-400 flex flex-col items-center space-y-1.5 mt-6">
                    <div class="flex flex-wrap justify-center gap-x-6 font-medium">
                        <span>睿立資產管理顧問有限公司 (統編: 90411790)</span>
                        <span>元業綠能驗證有限公司 (統編: 90000831)</span>
                        <span>天梁不動產股份有限公司 (統編: 93628169)</span>
                    </div>
                </footer>
            `;
        }

        function updateField(id, field, value) { 
            let target = getTargetDataArray(currentActiveTab).find(c => c.id === id);
            if (target) {
                target[field] = value; 
                triggerAutoSave();
            }
        }

        function updateCompanyName(id, value) {
            let target = getTargetDataArray(currentActiveTab).find(c => c.id === id);
            if (target) { 
                target.companyName = value; 
                renderSidebarSubLists(); 
                triggerAutoSave();
            }
        }

        function updateMeetSubject(id, value) {
            let target = getTargetDataArray(currentActiveTab).find(c => c.id === id);
            if(target) { 
                target.meetSubject = value; 
                renderSidebarSubLists(); 
                triggerAutoSave();
            }
        }

        function addNewCase() {
            const nid = "id-" + Date.now();
            let dataArr = getTargetDataArray(currentActiveTab);
            let obj = { id: nid, date: new Date().toISOString().slice(0, 16), status: "初期評估", manager: currentUserRole, is_deleted: false, deleted_at: null };
            
            if(currentActiveTab === 'internal-meet') {
                obj.meetSubject = "新睿立會議紀錄 " + (dataArr.length + 1);
            } else if(currentActiveTab === 'meeting') {
                obj.meetSubject = "外部對接會議記錄 " + (dataArr.length + 1);
            } else {
                obj.companyName = "全新案件項目 " + (dataArr.length + 1); 
            }
            dataArr.unshift(obj); selectedIds[currentActiveTab] = nid;
            renderSidebarSubLists(); renderMainForms();
            saveToCloudSilent();
        }

        let pendingDeleteId = null;
        function deleteCurrentCase() {
            let dataArr = getTargetDataArray(currentActiveTab);
            if (dataArr.length === 0) {
                alert("目前沒有可刪除的項目！");
                return;
            }
            pendingDeleteId = selectedIds[currentActiveTab];
            const target = dataArr.find(c => c.id === pendingDeleteId);
            if (target) {
                document.getElementById('delete-target-text').innerText = `確定要將「${target.companyName || target.meetSubject || '此項目'}」刪除嗎？`;
                document.getElementById('delete-modal').classList.remove('hidden');
            }
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.add('hidden');
            pendingDeleteId = null;
        }

        async function confirmDeleteCase() {
            if (!pendingDeleteId) return;
            let dataArr = getTargetDataArray(currentActiveTab);
            const idx = dataArr.findIndex(c => c.id === pendingDeleteId);
            if (idx !== -1) {
                dataArr[idx].is_deleted = true;
                dataArr[idx].deleted_at = new Date().toISOString();
                closeDeleteModal();
                renderSidebarSubLists();
                renderMainForms();
                await saveToCloudSilent();
            }
        }

        function openTrashModal() {
            const trashList = document.getElementById('trash-items-list');
            let allDeleted = [];
            ["case-eval", "solar", "trading", "meeting", "internal-meet"].forEach(tab => {
                const arr = getTargetDataArray(tab);
                arr.filter(c => c.is_deleted).forEach(c => allDeleted.push({ ...c, tabOrigin: tab }));
            });

            if (allDeleted.length === 0) {
                trashList.innerHTML = "<p class='text-xs text-slate-500 py-4 text-center'>資源回收桶是空的。</p>";
            } else {
                trashList.innerHTML = allDeleted.map(c => `
                    <div class="flex items-center justify-between bg-cosmic-950 p-3 rounded-xl border border-cosmic-700/50">
                        <div>
                            <div class="text-xs font-bold text-white">${c.companyName || c.meetSubject || '未命名案件'}</div>
                            <div class="text-[10px] text-slate-400">刪除時間：${c.deleted_at ? new Date(c.deleted_at).toLocaleString() : '未知'}</div>
                        </div>
                        <button onclick="restoreCase('${c.id}', '${c.tabOrigin}')" class="text-xs bg-amber-600 hover:bg-amber-500 text-white font-semibold px-3 py-1.5 rounded-lg transition">
                            <i class="fa-solid fa-rotate-left mr-1"></i>復原
                        </button>
                    </div>
                `).join('');
            }
            document.getElementById('trash-modal').classList.remove('hidden');
        }

        function closeTrashModal() {
            document.getElementById('trash-modal').classList.add('hidden');
        }

        async function restoreCase(id, tabOrigin) {
            let dataArr = getTargetDataArray(tabOrigin);
            let target = dataArr.find(c => c.id === id);
            if (target) {
                target.is_deleted = false;
                target.deleted_at = null;
                openTrashModal();
                renderSidebarSubLists();
                renderMainForms();
                await saveToCloudSilent();
            }
        }

        // ==================== Supabase 雲端資料同步核心 ====================
        async function fetchSupabaseData() {
            try {
                setSyncBadgeStatus('saving', '讀取資料庫中...');
                const { data, error } = await supabaseClient.from('ruili_cases').select('*').eq('id', 'main_data').single();
                if (data && data.content) {
                    const parsed = data.content;
                    caseEvalData = parsed.caseEvalData || [];
                    solarData = parsed.solarData || [];
                    tradingData = parsed.tradingData || [];
                    meetingData = parsed.meetingData || [];
                    internalMeetData = parsed.internalMeetData || [];
                }
                renderSidebarSubLists();
                renderMainForms();
                setSyncBadgeStatus('saved', '已連線');
            } catch (err) {
                console.error("Fetch Error:", err);
                setSyncBadgeStatus('error', '讀取失敗');
            }
        }

        async function saveToCloudSilent() {
            try {
                const payload = {
                    caseEvalData, solarData, tradingData, meetingData, internalMeetData
                };
                await supabaseClient.from('ruili_cases').upsert({ id: 'main_data', content: payload, updated_at: new Date().toISOString() });
            } catch (err) {
                console.error("Auto Save Error:", err);
            }
        }

        async function saveToCloud() {
            setSyncBadgeStatus('saving', '雲端儲存中...');
            await saveToCloudSilent();
            setSyncBadgeStatus('saved', '儲存成功！');
            alert("所有資料已成功儲存至雲端！");
        }

        // 初始化直接加載資料
        window.addEventListener('DOMContentLoaded', () => {
            fetchSupabaseData();
        });
    </script>
</body>
