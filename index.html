<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睿立業務系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <div id="app" class="flex h-screen overflow-hidden">
        <!-- 側邊欄 -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between shrink-0">
            <div>
                <div class="p-4 text-xl font-bold border-b border-slate-800 flex items-center justify-between">
                    <span>睿立業務管理系統</span>
                    <span id="sync-status" class="text-xs px-2 py-1 rounded bg-slate-700 text-slate-300">連線中...</span>
                </div>
                <nav class="p-2 space-y-1">
                    <button onclick="switchTab('case-eval')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-folder-open text-blue-400"></i> 案件評估
                    </button>
                    <button onclick="switchTab('solar')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-solar-panel text-amber-400"></i> 太陽能評估
                    </button>
                    <button onclick="switchTab('trading')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-handshake text-emerald-400"></i> 買賣盤整
                    </button>
                    <button onclick="switchTab('meeting')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-comments text-purple-400"></i> 外部紀錄
                    </button>
                    <button onclick="switchTab('internal-meet')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-users-gear text-indigo-400"></i> 內部紀錄
                    </button>
                </nav>
            </div>
            
            <!-- 案件列表區塊 -->
            <div class="p-3 border-t border-slate-800 flex-1 overflow-y-auto">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-slate-400 font-bold">案件清單</span>
                    <button onclick="addNewCase()" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-2 py-1 rounded">
                        <i class="fa-solid fa-plus"></i> 新增案件
                    </button>
                </div>
                <ul id="sidebar-case-list" class="space-y-1 text-sm"></ul>
            </div>
        </aside>

        <!-- 主要內容區 -->
        <main class="flex-1 flex flex-col overflow-hidden bg-slate-50">
            <header class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shrink-0">
                <h1 id="page-title" class="text-lg font-bold text-slate-800">案件評估</h1>
                <div class="flex items-center gap-2">
                    <button onclick="saveToCloud()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded text-sm font-medium transition">
                        <i class="fa-solid fa-cloud-arrow-up mr-1"></i> 手動儲存
                    </button>
                    <button onclick="deleteCurrentCase()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-1.5 rounded text-sm font-medium transition">
                        <i class="fa-solid fa-trash mr-1"></i> 刪除案件
                    </button>
                </div>
            </header>

            <!-- 渲染表單主要區塊 -->
            <div id="main-content" class="flex-1 overflow-y-auto p-6"></div>
        </main>
    </div>

    <!-- 刪除確認 Modal -->
    <div id="delete-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg max-w-sm w-full space-y-4">
            <h3 class="text-lg font-bold text-slate-900">確定要刪除案件嗎？</h3>
            <p class="text-sm text-slate-600">此動作將標記此案件為刪除並寫入雲端。</p>
            <div class="flex justify-end gap-2">
                <button onclick="closeDeleteModal()" class="px-4 py-2 border rounded text-slate-600 hover:bg-slate-100">取消</button>
                <button onclick="confirmDeleteCase()" class="px-4 py-2 bg-rose-600 text-white rounded hover:bg-rose-700">確定刪除</button>
            </div>
        </div>
    </div>

    <script>
        // 初始化 Supabase
        const SUPABASE_URL = 'https://YOUR_SUPABASE_URL.supabase.co'; // 請替換為您的 Supabase URL
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // 請替換為您的 Anon Key
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 全域狀態控制
        let currentActiveTab = 'case-eval';
        let currentUserRole = '中央控台';
        let isUserTyping = false;

        let selectedIds = {
            'case-eval': null,
            'solar': null,
            'trading': null,
            'meeting': null,
            'internal-meet': null
        };

        let caseEvalData = [];
        let solarData = [];
        let tradingData = [];
        let meetingData = [];
        let internalMeetData = [];

        // 頁面初始化
        window.addEventListener('DOMContentLoaded', async () => {
            await fetchSupabaseData();
            initSupabaseRealtime();
        });

        function setSyncBadgeStatus(type, text) {
            const badge = document.getElementById('sync-status');
            if (!badge) return;
            badge.innerText = text;
            if (type === 'saving') badge.className = "text-xs px-2 py-1 rounded bg-amber-500 text-white";
            else if (type === 'saved') badge.className = "text-xs px-2 py-1 rounded bg-emerald-600 text-white";
            else if (type === 'error') badge.className = "text-xs px-2 py-1 rounded bg-rose-600 text-white";
        }

        function switchTab(tabKey) {
            currentActiveTab = tabKey;
            const titles = {
                'case-eval': '案件評估系統',
                'solar': '太陽能案件試算',
                'trading': '買賣盤整系統',
                'meeting': '外部會議紀錄',
                'internal-meet': '內部會議紀錄'
            };
            document.getElementById('page-title').innerText = titles[tabKey] || '業務系統';
            renderSidebarSubLists();
            renderMainForms();
        }

        function getTargetDataArray(tabKey) {
            if (tabKey === 'case-eval') return caseEvalData;
            if (tabKey === 'solar') return solarData;
            if (tabKey === 'trading') return tradingData;
            if (tabKey === 'meeting') return meetingData;
            if (tabKey === 'internal-meet') return internalMeetData;
            return [];
        }

        function renderSidebarSubLists() {
            const listEl = document.getElementById('sidebar-case-list');
            if (!listEl) return;
            listEl.innerHTML = '';

            const currentData = getTargetDataArray(currentActiveTab).filter(c => !c.is_deleted);
            
            if (currentData.length === 0) {
                listEl.innerHTML = '<li class="text-xs text-slate-500 py-2">尚無案件資料</li>';
                return;
            }

            if (!selectedIds[currentActiveTab] && currentData.length > 0) {
                selectedIds[currentActiveTab] = currentData[0].id;
            }

            currentData.forEach(item => {
                const li = document.createElement('li');
                const isActive = item.id === selectedIds[currentActiveTab];
                li.className = `p-2 rounded cursor-pointer transition flex items-center justify-between ${
                    isActive ? 'bg-blue-600 text-white font-medium' : 'hover:bg-slate-800 text-slate-300'
                }`;
                li.onclick = () => {
                    selectedIds[currentActiveTab] = item.id;
                    renderSidebarSubLists();
                    renderMainForms();
                };
                li.innerHTML = `<span class="truncate w-40">${item.companyName || '未命名案件'}</span>`;
                listEl.appendChild(li);
            });
        }

        function renderMainForms() {
            const container = document.getElementById('main-content');
            if (!container) return;

            const activeId = selectedIds[currentActiveTab];
            const dataArr = getTargetDataArray(currentActiveTab).filter(c => !c.is_deleted);
            const activeCase = dataArr.find(c => c.id === activeId);

            if (!activeCase) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-64 text-slate-400">
                        <i class="fa-solid fa-folder-open text-4xl mb-2"></i>
                        <p>請點擊左側「新增案件」或選擇已有案件以開始編輯</p>
                    </div>`;
                return;
            }

            container.innerHTML = `
                <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 space-y-4 max-w-4xl">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">案件/公司名稱</label>
                            <input type="text" value="${activeCase.companyName || ''}" 
                                onfocus="isUserTyping=true" onblur="isUserTyping=false"
                                onchange="updateCaseField('${activeCase.id}', 'companyName', this.value)"
                                class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">專案進度</label>
                            <select onchange="updateCaseField('${activeCase.id}', 'evalStatus', this.value)"
                                class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="初期評估" ${activeCase.evalStatus === '初期評估' ? 'selected' : ''}>初期評估</option>
                                <option value="現場勘查" ${activeCase.evalStatus === '現場勘查' ? 'selected' : ''}>現場勘查</option>
                                <option value="簽約執行" ${activeCase.evalStatus === '簽約執行' ? 'selected' : ''}>簽約執行</option>
                                <option value="案件結案" ${activeCase.evalStatus === '案件結案' ? 'selected' : ''}>案件結案</option>
                            </select>
                        </div>
                    </div>

                    ${currentActiveTab === 'solar' ? renderSolarInputs(activeCase) : ''}
                </div>`;

            if (currentActiveTab === 'solar') {
                calculateSolarLive(activeCase.id);
            }
        }

        function renderSolarInputs(activeCase) {
            return `
                <hr class="my-4 border-slate-100">
                <h3 class="font-bold text-amber-600 text-sm mb-3">太陽能效益試算參數</h3>
                <div class="grid grid-cols-3 gap-4 bg-amber-50/50 p-4 rounded border border-amber-100">
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">預估坪數</label>
                        <input type="number" value="${activeCase.estPing || 0}" 
                            onfocus="isUserTyping=true" onblur="isUserTyping=false"
                            onchange="updateCaseField('${activeCase.id}', 'estPing', this.value); calculateSolarLive('${activeCase.id}')"
                            class="w-full border rounded px-3 py-1.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">預估電價 (元/度)</label>
                        <input type="number" step="0.1" value="${activeCase.estPrice || 3.5}" 
                            onfocus="isUserTyping=true" onblur="isUserTyping=false"
                            onchange="updateCaseField('${activeCase.id}', 'estPrice', this.value); calculateSolarLive('${activeCase.id}')"
                            class="w-full border rounded px-3 py-1.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">租金單價 (元/坪)</label>
                        <input type="number" value="${activeCase.estRentUnit || 0}" 
                            onfocus="isUserTyping=true" onblur="isUserTyping=false"
                            onchange="updateCaseField('${activeCase.id}', 'estRentUnit', this.value); calculateSolarLive('${activeCase.id}')"
                            class="w-full border rounded px-3 py-1.5 text-sm">
                    </div>
                </div>

                <div class="mt-4 p-4 bg-slate-800 text-white rounded space-y-2">
                    <div class="text-xs text-slate-400">試算估算收益</div>
                    <div class="flex justify-between text-sm">
                        <span>預估年發電收益:</span>
                        <span class="font-bold text-amber-400">$ <span id="res-est-1-${activeCase.id}">0</span></span>
                    </div>
                </div>`;
        }

        async function updateCaseField(id, field, value) {
            let dataArr = getTargetDataArray(currentActiveTab);
            let target = dataArr.find(c => c.id === id);
            if (target) {
                target[field] = value;
                renderSidebarSubLists();
                await saveToCloudSilent();
            }
        }

        function calculateSolarLive(id) {
            const activeCase = solarData.find(c => c.id === id);
            if (!activeCase) return;
            
            const estPing = parseFloat(activeCase.estPing || 0);
            const estPrice = parseFloat(activeCase.estPrice || 3.5);
            const estRentUnit = parseFloat(activeCase.estRentUnit || 0);
            
            // 預估收益計算
            const resEst1 = Math.round((estPing / 1.5) * 590 / 1000 * 4 * 365 * estPrice);
            const resEst2 = Math.round(estPing * 100);
            const resEst3 = Math.round(estPing * estRentUnit);
            
            // 現勘試算
            const surPanels = parseFloat(activeCase.surveyPanels || 0);
            const surWatts = parseFloat(activeCase.surveyWatts || 0);
            const surPrice = parseFloat(activeCase.surveyPrice || 4.8);
            const surBill = parseFloat(activeCase.surveyBill || 0);
            
            const totalKwh = Math.round((surPanels * surWatts / 1000) * 4 * 365);
            const resSur1 = Math.round(totalKwh * surPrice);
            const resSur2 = Math.round(surPanels * 150);
            const resSur3 = Math.round(resSur1 - surBill - resSur2);

            // 渲染至畫面
            const elEst1 = document.getElementById(`res-est-1-${id}`);
            if (elEst1) elEst1.innerText = resEst1.toLocaleString();
            
            const elEst2 = document.getElementById(`res-est-2-${id}`);
            if (elEst2) elEst2.innerText = resEst2.toLocaleString();
            
            const elEst3 = document.getElementById(`res-est-3-${id}`);
            if (elEst3) elEst3.innerText = resEst3.toLocaleString();

            const elSur1 = document.getElementById(`res-sur-1-${id}`);
            if (elSur1) elSur1.innerText = resSur1.toLocaleString();

            const elKwh = document.getElementById(`res-sur-kwh-${id}`);
            if (elKwh) elKwh.innerText = totalKwh.toLocaleString();

            const elSur2 = document.getElementById(`res-sur-2-${id}`);
            if (elSur2) elSur2.innerText = resSur2.toLocaleString();

            const elSur3 = document.getElementById(`res-sur-3-${id}`);
            if (elSur3) elSur3.innerText = resSur3.toLocaleString();
        }

        function refreshSums() {
            renderMainForms();
        }

        async function addNewCase() {
            const newId = "case_" + Date.now();
            const newCase = {
                id: newId,
                companyName: "新案件 " + new Date().toLocaleDateString(),
                evalDate: new Date().toISOString().slice(0, 16),
                evalManager: currentUserRole === '中央控台' ? '系統人員' : currentUserRole,
                evalStatus: "初期評估",
                services: [],
                landOwnerGroups: [],
                buildingsLegal: [],
                buildingsIllegal: [],
                clientFilesObj: [],
                ruiliFilesObj: []
            };

            if (currentActiveTab === 'case-eval') caseEvalData.unshift(newCase);
            else if (currentActiveTab === 'solar') solarData.unshift(newCase);
            else if (currentActiveTab === 'trading') tradingData.unshift(newCase);
            else if (currentActiveTab === 'meeting') meetingData.unshift(newCase);
            else if (currentActiveTab === 'internal-meet') internalMeetData.unshift(newCase);

            selectedIds[currentActiveTab] = newId;
            renderSidebarSubLists();
            renderMainForms();
            await saveToCloudSilent();
        }

        function deleteCurrentCase() {
            const currentId = selectedIds[currentActiveTab];
            if (!currentId) { alert("請先選擇要刪除的案件！"); return; }
            document.getElementById('delete-modal').classList.remove('hidden');
            document.getElementById('delete-modal').classList.add('flex');
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.add('hidden');
            document.getElementById('delete-modal').classList.remove('flex');
        }

        async function confirmDeleteCase() {
            const currentId = selectedIds[currentActiveTab];
            let dataArr = getTargetDataArray(currentActiveTab);
            let target = dataArr.find(c => c.id === currentId);
            
            if (target) {
                target.is_deleted = true;
                target.deleted_at = new Date().toISOString();
                closeDeleteModal();
                selectedIds[currentActiveTab] = null;
                renderSidebarSubLists();
                renderMainForms();
                await saveToCloudSilent();
            }
        }

        async function saveToCloudSilent() {
            try {
                const payload = {
                    id: 1,
                    case_eval_data: caseEvalData,
                    solar_data: solarData,
                    trading_data: tradingData,
                    meeting_data: meetingData,
                    internal_meet_data: internalMeetData,
                    updated_at: new Date().toISOString()
                };

                const { error } = await supabaseClient.from('ruili_system_data').upsert(payload);
                if (error) console.error("Cloud Save Error:", error);
            } catch (e) {
                console.error("Save failed", e);
            }
        }

        async function saveToCloud() {
            setSyncBadgeStatus('saving', '雲端同步中...');
            await saveToCloudSilent();
            setSyncBadgeStatus('saved', '手動儲存成功');
        }

        async function fetchSupabaseData() {
            setSyncBadgeStatus('saving', '讀取資料中...');
            try {
                const { data, error } = await supabaseClient.from('ruili_system_data').select('*').eq('id', 1).single();
                if (error && error.code !== 'PGRST116') {
                    console.error("Fetch Error:", error);
                    setSyncBadgeStatus('error', '連線失敗');
                    return;
                }

                if (data) {
                    caseEvalData = data.case_eval_data || [];
                    solarData = data.solar_data || [];
                    tradingData = data.trading_data || [];
                    meetingData = data.meeting_data || [];
                    internalMeetData = data.internal_meet_data || [];
                }
                
                renderSidebarSubLists();
                renderMainForms();
                setSyncBadgeStatus('saved', '資料已同步');
            } catch (e) {
                console.error("Fetch Catch Error:", e);
                setSyncBadgeStatus('error', '資料載入異常');
            }
        }

        function initSupabaseRealtime() {
            supabaseClient
                .channel('public:ruili_system_data')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'ruili_system_data' }, payload => {
                    if (!isUserTyping && payload.new) {
                        caseEvalData = payload.new.case_eval_data || [];
                        solarData = payload.new.solar_data || [];
                        tradingData = payload.new.trading_data || [];
                        meetingData = payload.new.meeting_data || [];
                        internalMeetData = payload.new.internal_meet_data || [];
                        renderSidebarSubLists();
                        renderMainForms();
                        setSyncBadgeStatus('saved', '已接收最新異動');
                    }
                })
                .subscribe();
        }
    </script>
</body>
</html>
