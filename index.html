<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睿立業務系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cosmic: {
                            950: '#060b19', 900: '#0a142c', 800: '#112246', 700: '#1a3160', 600: '#234280', 500: '#315cb5', 400: '#4c7cd4'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #060b19; color: #e2e8f0; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* 📜 N版極致：專屬直式 A4 滿頁匯出與物理屏蔽排版優化 */
        @media print {
            @page {
                size: portrait;
                margin: 10mm !important;
            }
            body { background: white !important; color: black !important; overflow: visible !important; }
            aside, header, .no-print, input[type="file"], button, #login-overlay, #trash-modal { display: none !important; }
            main { padding: 0 !important; margin: 0 !important; overflow: visible !important; display: block !important; }
            .print-container { 
                width: 210mm !important; 
                max-width: 100% !important;
                background: white !important; 
                color: black !important; 
                padding: 0mm !important;
                box-shadow: none !important;
                border: none !important;
                display: block !important;
            }
            .card-box {
                background: transparent !important;
                border: 1px solid #000 !important;
                color: black !important;
                padding: 12px !important;
                border-radius: 8px !important;
                page-break-inside: avoid !important;
            }
            input, select, textarea { 
                background: transparent !important; 
                color: black !important; 
                border: none !important; 
                border-bottom: 1px solid #666 !important;
                border-radius: 0 !important;
                padding: 2px !important;
                font-weight: bold !important;
            }
            textarea {
                height: auto !important;
                overflow: visible !important;
            }
            .text-white, .text-slate-300, .text-slate-400, .text-amber-300, .text-amber-400, .text-cyan-400, .text-emerald-400, .text-purple-300, .text-purple-400, .text-indigo-300, .text-indigo-400, .text-teal-400, .text-sky-400, .text-violet-400, label { 
                color: black !important; 
                -webkit-text-fill-color: black !important;
                opacity: 1 !important;
                display: inline-block !important;
                font-weight: bold !important;
            }
            .bg-cosmic-950, .bg-cosmic-900, .bg-cosmic-800, .bg-cosmic-950\/40, .bg-cosmic-900\/60, .bg-cosmic-950\/60, .bg-cosmic-900\/30, .bg-cosmic-950\/80, .bg-cosmic-950\/50 { background: transparent !important; }
            footer { border-top: 1px solid black !important; color: black !important; margin-top: 20px !important; }
            h3, h4 { color: black !important; border-bottom: 1px solid black !important; padding-bottom: 4px !important; }
        }

        /* 拖曳排序樣式 */
        .drag-item { cursor: grab; }
        .drag-item:active { cursor: grabbing; }
        .drag-over { border-top: 2px solid #38bdf8 !important; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <script>
        // ==================== Supabase 設定與初始化 ====================
        const SUPABASE_URL = "https://mfgfifcyhxeqjyeaokub.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_b712iObCqLZeepWP9SVQaA__Rg2_PTj";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUserRole = "黃逸豪";

        let caseEvalData = [];
        let evalItemData = [];
        let solarData = [];
        let tradingData = [];
        let meetingData = [];
        let internalMeetData = [];

        let selectedIds = { "case-eval": null, "eval-item": null, "solar": null, "trading": null, "meeting": null, "internal-meet": null };
        let currentActiveTab = "case-eval";

        const managersList = ["樊靖畇", "鄭家承", "陳宥騰", "楊裕憲", "楊淯淳", "黃逸豪"];
        const statusConfig = { "初期評估": "bg-emerald-500", "已報價": "bg-blue-500", "準備簽約": "bg-amber-500", "已簽約": "bg-red-500", "結案": "bg-purple-500", "沒下文": "bg-slate-600" };

        let autoSaveTimer = null;
        let isUserTyping = false;
        let draggedItemIndex = null;

        function autoResizeTextarea(el) {
            if (!el) return;
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function setSyncBadgeStatus(state, text) {
            const badge = document.getElementById('sync-status-badge');
            const icon = document.getElementById('sync-icon');
            const label = document.getElementById('sync-text');
            if(!badge) return;
            badge.classList.remove('hidden');
            
            if (state === 'saving') {
                icon.className = 'fa-solid fa-spinner animate-spin text-amber-400';
                label.innerText = text || '雲端同步中...';
                label.className = 'text-amber-400 font-medium';
            } else if (state === 'saved') {
                icon.className = 'fa-solid fa-cloud-check text-emerald-400';
                label.innerText = text || '資料已同步';
                label.className = 'text-emerald-400 font-medium';
            } else if (state === 'error') {
                icon.className = 'fa-solid fa-triangle-exclamation text-red-400';
                label.innerText = text || '同步失敗';
                label.className = 'text-red-400 font-medium';
            } else {
                icon.className = 'fa-solid fa-cloud text-slate-400';
                label.innerText = text || '已連線';
                label.className = 'text-slate-400';
            }
        }

        function triggerAutoSave() {
            isUserTyping = true;
            setSyncBadgeStatus('saving', '編輯中...');
            if (autoSaveTimer) clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(async () => {
                await saveToCloudSilent();
                isUserTyping = false;
                setSyncBadgeStatus('saved', '雲端已同步');
            }, 800);
        }

        // ==================== 資料遠端同步 Supabase API (解決資料讀不到與儲存問題) ====================
        async function fetchSupabaseData() {
            setSyncBadgeStatus('saving', '載入資料中...');
            try {
                const { data, error } = await supabaseClient.from('cases').select('*');
                if (error) throw error;

                caseEvalData = []; evalItemData = []; solarData = []; tradingData = []; meetingData = []; internalMeetData = [];

                if (data && data.length > 0) {
                    data.forEach(row => {
                        let obj = Object.assign({ id: row.id, companyName: row.company_name, meetSubject: row.meet_subject, is_deleted: row.is_deleted, deleted_at: row.deleted_at }, row.data || {});
                        if (row.category === 'case-eval') caseEvalData.push(obj);
                        else if (row.category === 'eval-item') evalItemData.push(obj);
                        else if (row.category === 'solar') solarData.push(obj);
                        else if (row.category === 'trading') tradingData.push(obj);
                        else if (row.category === 'meeting') meetingData.push(obj);
                        else if (row.category === 'internal-meet') internalMeetData.push(obj);
                    });
                }
                setSyncBadgeStatus('saved', '載入完成');
                renderSidebarSubLists();
                renderMainForms();
            } catch (err) {
                console.error('Fetch Data Error:', err);
                setSyncBadgeStatus('error', '載入失敗');
            }
        }

        async function saveToCloudSilent() {
            const arr = getTargetDataArray(currentActiveTab);
            const activeCase = arr.find(c => c.id === selectedIds[currentActiveTab]);
            if (!activeCase) return;

            const payload = {
                id: activeCase.id,
                category: currentActiveTab,
                company_name: activeCase.companyName || '',
                meet_subject: activeCase.meetSubject || '',
                data: activeCase,
                is_deleted: !!activeCase.is_deleted,
                deleted_at: activeCase.deleted_at || null,
                updated_at: new Date().toISOString()
            };

            const { error } = await supabaseClient.from('cases').upsert(payload, { onConflict: 'id' });
            if (error) {
                console.error("Save Error:", error);
                setSyncBadgeStatus('error', '儲存失敗');
            }
        }

        async function saveToCloud() {
            setSyncBadgeStatus('saving', '雲端儲存中...');
            await saveToCloudSilent();
            alert('資料已成功同步儲存至 Supabase 雲端！');
            setSyncBadgeStatus('saved', '雲端已同步');
        }

        function initSupabaseRealtime() {
            supabaseClient.channel('public:cases')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'cases' }, payload => {
                    if (!isUserTyping) fetchSupabaseData();
                })
                .subscribe();
        }

        function handleRoleLogin() {
            const role = document.getElementById('login-role').value;
            const pass = document.getElementById('login-pass').value;
            
            if ((role === '黃逸豪' && pass === '8888') || (role === '中央控台' && pass === '9999')) {
                currentUserRole = role;
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('login-pass').value = '';

        // 📂 Supabase Storage 關鍵修復：上傳依據分類，自動帶入案件評估資料夾
        async function uploadFileToSupabaseStorage(file) {
            try {
                const rawExtension = file.name.includes('.') ? file.name.split('.').pop() : '';
                const baseName = file.name.includes('.') ? file.name.substring(0, file.name.lastIndexOf('.')) : file.name;
                let cleanBase = baseName.replace(/[^a-zA-Z0-9.\-_]/g, '_').replace(/_+/g, '_');
                if (!cleanBase || cleanBase === '_') cleanBase = 'file';
                const cleanExt = rawExtension.replace(/[^a-zA-Z0-9]/g, '');
                const safeFileName = cleanExt ? `${cleanBase}.${cleanExt}` : cleanBase;
                const uniqueId = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).substring(2, 10);
                
                // 💡 在此處依據目前 Tab 自動設定 Supabase 儲存資料夾 (例如：case-eval/ / eval-item/)
                const folderPath = currentActiveTab || 'general';
                const filePath = `${folderPath}/${Date.now()}_${uniqueId}_${safeFileName}`;
                
                const { data, error } = await supabaseClient.storage.from('ruili-files').upload(filePath, file);
                if (error) {
                    console.error("Storage Error:", error);
                    return URL.createObjectURL(file);
                }
                const { data: publicData } = supabaseClient.storage.from('ruili-files').getPublicUrl(filePath);
                return publicData.publicUrl;
            } catch (err) {
                console.error("Upload error:", err);
                return URL.createObjectURL(file);
            }
        }

                        <div class="flex justify-between items-center border-b border-cosmic-700/40 pb-1.5">
                            <h4 class="text-xs font-bold text-indigo-400"><i class="fa-solid fa-layer-group mr-1.5"></i>三、服務項目</h4>
                            <button onclick="addServiceRow('${c.id}')" class="text-[10px] bg-indigo-900 border border-indigo-700 px-2 py-0.5 rounded no-print">[＋ 新增服務項目]</button>
                        </div>
                        <div class="space-y-4">
                            ${c.services.map((srv, idx) => `
                                <div class="bg-cosmic-900/60 border border-cosmic-700/50 p-4 rounded-xl space-y-3 relative card-box">
                                    <i onclick="removeServiceRow('${c.id}', ${idx})" class="fa-solid fa-circle-xmark text-red-400 absolute top-3 right-3 cursor-pointer text-sm hover:text-red-300 no-print"></i>
                                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                                        <div><label class="text-slate-400 block mb-0.5">服務項目：</label><input type="text" value="${srv.name||''}" oninput="updateServiceField('${c.id}', ${idx}, 'name', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1 text-white"></div>
                                        <div><label class="text-slate-400 block mb-0.5">報價金額：</label><input type="number" value="${srv.quote||''}" oninput="updateServiceField('${c.id}', ${idx}, 'quote', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1 text-white"></div>
                                        <div><label class="text-slate-400 block mb-0.5">簽約金額：</label><input type="number" value="${srv.contract||''}" oninput="updateServiceField('${c.id}', ${idx}, 'contract', this.value)" class="w-full bg-cosmic-950 border border-cosmic-700 rounded px-2 py-1 text-white"></div>
                                    </div>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                                        <div><label class="text-slate-400 block mb-0.5">案件說明：</label><textarea oninput="updateServiceField('${c.id}', ${idx}, 'desc', this.value); autoResizeTextarea(this);" class="w-full bg-cosmic-950 border border-cosmic-700 rounded p-1.5 text-white overflow-hidden resize-none block whitespace-pre-wrap">${srv.desc||''}</textarea></div>
                                        <div><label class="text-slate-400 block mb-0.5">業務即時狀態備註：</label><textarea oninput="updateServiceField('${c.id}', ${idx}, 'remark', this.value); autoResizeTextarea(this);" class="w-full bg-cosmic-950 border border-cosmic-700 rounded p-1.5 text-white overflow-hidden resize-none block whitespace-pre-wrap">${srv.remark||''}</textarea></div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- 四、檔案上傳 (支援拖曳上傳) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                        <div ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDropFile(event, '${c.id}', 'project', 'client')" class="bg-cosmic-950/40 border-2 border-dashed border-cosmic-700/60 hover:border-violet-400 p-4 rounded-xl space-y-3 transition card-box">
                            <div class="flex justify-between items-center border-b border-violet-500/30 pb-1">
                                <span class="font-bold text-violet-400"><i class="fa-solid fa-cloud-arrow-up mr-1.5"></i>客戶應備檔案上傳 (可拖曳檔案至此)</span>
                                <label class="text-[10px] bg-violet-900 text-white px-2.5 py-1 rounded cursor-pointer font-medium hover:bg-violet-800 transition no-print">
                                    [＋ 上傳各類型檔案]
                                    <input type="file" multiple class="hidden" onchange="handleProjectFileUpload(this, '${c.id}', 'client')">
                                </label>
                            </div>
                            <div class="space-y-2" id="file-list-client">
                                ${c.clientFilesObj.map((f, i) => `
                                    <div class="bg-cosmic-900/80 p-2.5 rounded border border-cosmic-700/40 text-xs space-y-1.5 card-box">
                                        <div class="text-slate-400 truncate"><i class="fa-solid fa-file-shield mr-2 text-violet-400"></i>原始名稱: ${f.actualName}</div>
                                        <div class="flex justify-between items-center pt-1 border-t border-cosmic-700/20 no-print">
                                            <button onclick="previewFileUrl('${f.url}', '${f.clientName || f.actualName}')" class="text-cyan-400 hover:text-cyan-300 text-[11px] font-medium"><i class="fa-solid fa-eye mr-1"></i>預覽/開啟檔案</button>
                                            <i onclick="removeProjectFile('${c.id}', 'client', ${i})" class="fa-solid fa-trash text-red-400 cursor-pointer hover:text-red-300"></i>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDropFile(event, '${c.id}', 'project', 'ruili')" class="bg-cosmic-950/40 border-2 border-dashed border-cosmic-700/60 hover:border-cyan-400 p-4 rounded-xl space-y-3 transition card-box">
                            <div class="flex justify-between items-center border-b border-cyan-500/30 pb-1">
                                <span class="font-bold text-cyan-400"><i class="fa-solid fa-cloud-arrow-up mr-1.5"></i>睿立調閱檔案上傳 (可拖曳檔案至此)</span>
                                <label class="text-[10px] bg-cyan-900 text-white px-2.5 py-1 rounded cursor-pointer font-medium hover:bg-cyan-800 transition no-print">
                                    [＋ 上傳各類型檔案]
                                    <input type="file" multiple class="hidden" onchange="handleProjectFileUpload(this, '${c.id}', 'ruili')">
                                </label>
                            </div>
                            <div class="space-y-2" id="file-list-ruili">
                                ${c.ruiliFilesObj.map((f, i) => `
                                    <div class="bg-cosmic-900/80 p-2.5 rounded border border-cosmic-700/40 text-xs space-y-1.5 card-box">
                                        <div class="text-slate-400 truncate"><i class="fa-solid fa-file-signature mr-2 text-cyan-400"></i>原始名稱: ${f.actualName}</div>
                                        <div class="flex justify-between items-center pt-1 border-t border-cosmic-700/20 no-print">
                                            <button onclick="previewFileUrl('${f.url}', '${f.clientName || f.actualName}')" class="text-cyan-400 hover:text-cyan-300 text-[11px] font-medium"><i class="fa-solid fa-eye mr-1"></i>預覽/開啟檔案</button>
                                            <i onclick="removeProjectFile('${c.id}', 'ruili', ${i})" class="fa-solid fa-trash text-red-400 cursor-pointer hover:text-red-300"></i>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    ${generateFooterHTML()}
                </div>
            `;
        }

        function generateSolarHTML(c) { return `<div class="p-4 text-white">太陽能模組載入中...</div>`; }
        function generateTradingHTML(c) { return `<div class="p-4 text-white">買賣模組載入中...</div>`; }
        function generateMeetingHTML(c) { return `<div class="p-4 text-white">會議記錄載入中...</div>`; }
        function generateInternalMeetHTML(c) { return `<div class="p-4 text-white">內部會議載入中...</div>`; }

        function generateFooterHTML() {
            return `
                <footer class="bg-cosmic-950 px-6 py-4 border-t border-cosmic-700/40 text-[11px] text-slate-400 flex flex-col items-center space-y-1.5 mt-6">
                    <div class="flex flex-wrap justify-center gap-x-6 font-medium">
                        <span>睿立資產管理顧問有限公司</span>
                        <span>元業綠能驗證有限公司</span>
                        <span>天梁不動產股份有限公司</span>
                    </div>
                </footer>
            `;
        }

        function updateField(id, field, value) {
            let target = getTargetDataArray(currentActiveTab).find(c => c.id === id);
            if (target) { target[field] = value; triggerAutoSave(); }
        }

        function updateCompanyName(id, value) {
            let target = getTargetDataArray(currentActiveTab).find(c => c.id === id);
            if (target) { target.companyName = value; renderSidebarSubLists(); triggerAutoSave(); }
        }

        async function handleProjectFileUpload(inputEl, id, side) {
            let target = getTargetDataArray(currentActiveTab).find(c => c.id === id);
            if (target && inputEl.files) {
                setSyncBadgeStatus('saving', '檔案上傳中...');
                for (let i = 0; i < inputEl.files.length; i++) {
                    let file = inputEl.files[i];
                    let fileUrl = await uploadFileToSupabaseStorage(file);
                    let fileObj = { clientName: file.name, actualName: file.name, url: fileUrl };
                    if(side === 'client') target.clientFilesObj.push(fileObj);
                    else target.ruiliFilesObj.push(fileObj);
                }
                renderMainForms();
                await saveToCloudSilent();
                setSyncBadgeStatus('saved', '雲端已同步');
            }
        }

        function removeProjectFile(id, side, idx) {
            let target = getTargetDataArray(currentActiveTab).find(c => c.id === id);
            if (target) {
                if(side === 'client') target.clientFilesObj.splice(idx, 1);
                else target.ruiliFilesObj.splice(idx, 1);
                renderMainForms();
                triggerAutoSave();
            }
        }

        function addServiceRow(id) {
            let target = caseEvalData.find(c => c.id === id);
            if (target) {
                target.services.push({ name: '', quote: '', contract: '', desc: '', remark: '' });
                renderMainForms();
                triggerAutoSave();
            }
        }

        function removeServiceRow(id, idx) {
            let target = caseEvalData.find(c => c.id === id);
            if (target) {
                target.services.splice(idx, 1);
                renderMainForms();
                triggerAutoSave();
            }
        }

        function updateServiceField(id, idx, field, value) {
            let target = caseEvalData.find(c => c.id === id);
            if (target && target.services[idx]) {
                target.services[idx][field] = value;
                triggerAutoSave();
            }
        }

        function calculateSolarLive(id) {}
    </script>
</body>
</html>
